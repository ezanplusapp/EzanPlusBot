<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TikTok OAuth Success • Ezan Plus Media Studio</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #070B14;
      --card: #0F172A;
      --border: #1E293B;
      --text: #F8FAFC;
      --muted: #94A3B8;
      --green: #10B981;
      --red: #FE2C55;
    }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Manrope', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      padding: 24px;
      box-sizing: border-box;
    }
    .auth-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 44px 36px;
      max-width: 580px;
      width: 100%;
      text-align: center;
      box-shadow: 0 24px 60px rgba(0,0,0,0.5);
    }
    .success-badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: rgba(16, 185, 129, 0.15);
      border: 1px solid rgba(16, 185, 129, 0.3);
      color: #34D399;
      padding: 6px 16px;
      border-radius: 20px;
      font-size: 13px;
      font-weight: 700;
      margin-bottom: 20px;
    }
    .error-badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: rgba(254, 44, 85, 0.15);
      border: 1px solid rgba(254, 44, 85, 0.3);
      color: #FE2C55;
      padding: 6px 16px;
      border-radius: 20px;
      font-size: 13px;
      font-weight: 700;
      margin-bottom: 20px;
    }
    h1 {
      font-size: 26px;
      font-weight: 800;
      letter-spacing: -0.01em;
      margin-bottom: 10px;
      color: #FFF;
    }
    p {
      font-size: 14px;
      color: var(--muted);
      line-height: 1.6;
      margin-bottom: 24px;
    }
    .code-box {
      background: rgba(7, 11, 20, 0.7);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 16px;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      font-size: 14px;
      word-break: break-all;
      margin-bottom: 24px;
      color: #38BDF8;
      user-select: all;
      text-align: left;
      line-height: 1.5;
    }
    .btn-group {
      display: flex;
      justify-content: center;
      gap: 12px;
      flex-wrap: wrap;
    }
    .btn {
      background: var(--red);
      color: #fff;
      border: none;
      padding: 12px 24px;
      font-size: 14px;
      font-weight: 700;
      border-radius: 10px;
      cursor: pointer;
      transition: all 0.2s ease;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      text-decoration: none;
    }
    .btn:hover {
      transform: translateY(-1px);
      box-shadow: 0 6px 20px rgba(254, 44, 85, 0.4);
    }
    .btn-secondary {
      background: rgba(255, 255, 255, 0.08);
      color: var(--text);
      border: 1px solid var(--border);
    }
    .btn-secondary:hover {
      background: rgba(255, 255, 255, 0.15);
      box-shadow: none;
    }
  </style>
</head>
<body>
  <div class="auth-card" id="card">
    <div class="success-badge" id="badge">● TikTok OAuth 2.0 Connected</div>
    <h1 id="title">Authorization Successful</h1>
    <p id="desc">The official TikTok channel (<strong>@ezanplus</strong>) has been successfully authenticated for Ezan Plus Editorial Media Studio.</p>
    
    <div class="code-box" id="codeText">Loading authorization code...</div>
    
    <div class="btn-group">
      <button class="btn" id="copyBtn" onclick="copyCode()">
        📋 Copy Auth Code
      </button>
      <a href="/studio" class="btn btn-secondary">
        &larr; Return to Studio
      </a>
    </div>
  </div>

  <script>
    const urlParams = new URLSearchParams(window.location.search);
    const code = urlParams.get('code');
    const error = urlParams.get('error') || urlParams.get('error_description');

    const badge = document.getElementById('badge');
    const title = document.getElementById('title');
    const desc = document.getElementById('desc');
    const codeText = document.getElementById('codeText');
    const copyBtn = document.getElementById('copyBtn');

    if (error) {
      badge.className = 'error-badge';
      badge.innerText = '● Authorization Error';
      title.innerText = 'Connection Failed';
      desc.innerText = 'TikTok returned an error: ' + error;
      codeText.innerText = error;
      copyBtn.style.display = 'none';
    } else if (code) {
      codeText.innerText = code;
    } else {
      badge.className = 'error-badge';
      badge.innerText = '● Code Not Found';
      title.innerText = 'Missing Parameter';
      desc.innerText = 'No authorization code detected in the query parameters.';
      codeText.innerText = window.location.href;
      copyBtn.style.display = 'none';
    }

    function copyCode() {
      if (code) {
        navigator.clipboard.writeText(code).then(() => {
          copyBtn.innerText = '✅ Code Copied!';
          setTimeout(() => {
            copyBtn.innerText = '📋 Copy Auth Code';
          }, 3000);
        });
      }
    }
  </script>
</body>
</html>
