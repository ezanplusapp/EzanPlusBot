name = "ezan-plus-tetikleyici"
main = "index.js"
compatibility_date = "2026-08-15"

workers_dev = true
preview_urls = false

[vars]
GITHUB_REPO = "ezanplusapp/EzanPlusBot"

[triggers]
# Günde 4 Dağıtım Slotu (TSİ = UTC+3) — Cloudflare Workers (Sıfır Jitter)
# 1. Slot: 08:30 TSİ (05:30 UTC) — Kur'an Sözlüğü Kartı (4:5 + 9:16)
# 2. Slot: 13:00 TSİ (10:00 UTC) — Kur'an Tilaveti Reels (9:16)
# 3. Slot: 17:00 TSİ (14:00 UTC) — Sahih Hadis-i Şerif (V20 Video)
# 4. Slot: 19:30 TSİ (16:30 UTC) — Günün Duası (V20 Video)
crons = [
  "30 5 * * *",
  "0 10 * * *",
  "0 14 * * *",
  "30 16 * * *"
]
