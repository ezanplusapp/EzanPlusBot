name: Günlük Yayın Otomasyonu (4 Dağıtım Slotu)

on:
  # 1. Cloudflare Edge Cron (Birincil ve Yetkili Zamanlayıcı: repository_dispatch)
  # GitHub Actions'ın dahili 'schedule' mekanizması gecikmeli (15-30 dk) tetiklenip mükerrer içerik
  # üretimine yol açtığı için devre dışı bırakılmıştır. Zamanlamayı 0 ms gecikmeyle Cloudflare Worker yönetir.
  # schedule:
  #   - cron: '30 5 * * *'   # 08:30 TSİ — Kur'an Sözlüğü Kartı (4:5 + 9:16)
  #   - cron: '0 10 * * *'   # 13:00 TSİ — Kur'an Tilaveti Reels (9:16)
  #   - cron: '0 14 * * *'   # 17:00 TSİ — Sahih Hadis-i Şerif (V20 Video)
  #   - cron: '30 16 * * *'  # 19:30 TSİ — Günün Duası (V20 Video)

  # 2. Manuel Web Arayüzü Tetiklemesi
  workflow_dispatch:
    inputs:
      tur:
        description: 'Üretilecek İçerik Türü'
        type: choice
        options:
          - reels
          - hadis
          - dua
          - kelime
          - ayet
        default: 'reels'
      auto_publish:
        description: 'Telegram onayı beklemeden doğrudan yayınla'
        type: boolean
        default: false
      tema:
        description: 'Özel tema, sure:ayet veya arama terimi (Boş bırakılırsa tescilli külliyattan seçilir)'
        type: string
        default: ''

  # 3. Harici Webhook (Cloudflare Worker / curl / repository_dispatch)
  repository_dispatch:
    types: [gunluk_yayin, gunluk_reels, gunluk_hadis, gunluk_dua, gunluk_kelime]

concurrency:
  group: reels-otomasyon-${{ github.event.inputs.tur || github.event.client_payload.tur || 'genel' }}
  cancel-in-progress: false

jobs:
  icerik_uret_ve_yayinla:
    name: İçerik Üret ve Dağıt
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write

    steps:
      - name: Kodu Çek
        uses: actions/checkout@v4

      - name: Python 3.11 Kur
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: FFmpeg ve Sistem Fontlarını Kur
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-noto fonts-noto-color-emoji

      - name: Python Paketlerini Yükle
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Ortam Değişkenlerini ve Token Dosyalarını Hazırla
        env:
          ENV_CONTENT: |
            GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY }}
            TELEGRAM_BOT_TOKEN=${{ secrets.TELEGRAM_BOT_TOKEN }}
            TELEGRAM_CHAT_ID=${{ secrets.TELEGRAM_CHAT_ID }}
            INSTAGRAM_ACCOUNT_ID=${{ secrets.INSTAGRAM_ACCOUNT_ID }}
            INSTAGRAM_ACCESS_TOKEN=${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
            FACEBOOK_PAGE_ID=${{ secrets.FACEBOOK_PAGE_ID }}
            FACEBOOK_PAGE_ACCESS_TOKEN=${{ secrets.FACEBOOK_PAGE_ACCESS_TOKEN }}
            META_APP_ID=${{ secrets.META_APP_ID }}
            META_APP_SECRET=${{ secrets.META_APP_SECRET }}
            THREADS_APP_ID=${{ secrets.THREADS_APP_ID }}
            THREADS_APP_SECRET=${{ secrets.THREADS_APP_SECRET }}
            THREADS_USER_ID=${{ secrets.THREADS_USER_ID }}
            THREADS_ACCESS_TOKEN=${{ secrets.THREADS_ACCESS_TOKEN }}
            TIKTOK_CLIENT_KEY=${{ secrets.TIKTOK_CLIENT_KEY }}
            TIKTOK_CLIENT_SECRET=${{ secrets.TIKTOK_CLIENT_SECRET }}
            TIKTOK_REFRESH_TOKEN=${{ secrets.TIKTOK_REFRESH_TOKEN }}
            FISH_AUDIO_API_KEY=${{ secrets.FISH_AUDIO_API_KEY }}
            FISH_AUDIO_VOICE_ID=${{ secrets.FISH_AUDIO_VOICE_ID }}
            ELEVENLABS_API_KEY=${{ secrets.ELEVENLABS_API_KEY }}
            ELEVENLABS_VOICE_ID=${{ secrets.ELEVENLABS_VOICE_ID }}
            R2_ACCOUNT_ID=${{ secrets.R2_ACCOUNT_ID }}
            R2_ACCESS_KEY_ID=${{ secrets.R2_ACCESS_KEY_ID }}
            R2_SECRET_ACCESS_KEY=${{ secrets.R2_SECRET_ACCESS_KEY }}
            R2_BUCKET_NAME=${{ secrets.R2_BUCKET_NAME }}
            R2_PUBLIC_DOMAIN=${{ secrets.R2_PUBLIC_DOMAIN }}
            IMGBB_API_KEY=${{ secrets.IMGBB_API_KEY }}
          YT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET_JSON }}
          YT_TOKEN: ${{ secrets.YOUTUBE_TOKEN_JSON }}
          TT_TOKEN: ${{ secrets.TIKTOK_TOKEN_JSON }}
        run: |
          mkdir -p data
          printf "%s\n" "$ENV_CONTENT" > .env
          if [ -n "$YT_SECRET" ]; then
            printf "%s\n" "$YT_SECRET" > client_secret.json
          fi
          if [ -n "$YT_TOKEN" ]; then
            printf "%s\n" "$YT_TOKEN" > data/youtube_token.json
          fi
          if [ -n "$TT_TOKEN" ]; then
            printf "%s\n" "$TT_TOKEN" > data/tiktok_token.json
          fi

      - name: İçerik Üretim ve Yayın Motorunu Çalıştır
        run: |
          TUR="${{ github.event.client_payload.tur || github.event.inputs.tur || '' }}"
          TEMA="${{ github.event.client_payload.tema || github.event.inputs.tema || '' }}"
          AUTO="${{ github.event.client_payload.auto_publish || github.event.inputs.auto_publish || 'false' }}"

          # Eğer zamanlanmış cron ise ve tur belirtilmemişse saate göre slot tespiti yap
          if [ -z "$TUR" ]; then
            UTC_HOUR=$(date -u +%H)
            if [ "$UTC_HOUR" -eq 5 ] || [ "$UTC_HOUR" -eq 6 ]; then
              TUR="kelime"
            elif [ "$UTC_HOUR" -eq 9 ] || [ "$UTC_HOUR" -eq 10 ]; then
              TUR="reels"
            elif [ "$UTC_HOUR" -eq 13 ] || [ "$UTC_HOUR" -eq 14 ]; then
              TUR="hadis"
            elif [ "$UTC_HOUR" -eq 16 ] || [ "$UTC_HOUR" -eq 17 ]; then
              TUR="dua"
            else
              TUR="reels"
            fi
          fi

          ARGS="--tur $TUR --bekleme 60 --otomatik"
          if [ "$AUTO" = "false" ]; then
            ARGS="--tur $TUR --bekleme 2700"
          fi
          if [ -n "$TEMA" ]; then
            ARGS="$ARGS --tema '$TEMA'"
          fi

          echo "🚀 Çalıştırılıyor: python -m src.otomasyon $ARGS"
          PYTHONPATH=. python -m src.otomasyon $ARGS

      - name: Yayın Geçmişini Kaydet ve Depoya Gönder
        if: always()
        run: |
          git config user.name "Ezan Plus Bot"
          git config user.email "bot@ezanplus.com"
          python - <<'PY'
          import sqlite3
          for db in ["data/kuran/kuran.db", "data/hadisler/hadisler.db", "data/bot.db"]:
              try:
                  with sqlite3.connect(db) as con:
                      con.execute("PRAGMA wal_checkpoint(TRUNCATE)")
              except Exception:
                  pass
          PY
          git add -f data/yayin_gecmisi.json data/dualar/dualar.json data/kelimeler/kelimeler.json data/kuran/kuran.db data/hadisler/hadisler.db data/bot.db data/arsiv 2>/dev/null || git add data/yayin_gecmisi.json data/dualar/dualar.json data/kelimeler/kelimeler.json data/kuran/kuran.db data/hadisler/hadisler.db data/arsiv || true
          if ! git diff --staged --quiet; then
            git commit -m "chore: Günlük yayın geçmişi, külliyat ve repo arşivi güncellendi [skip ci]"
            git pull --rebase --autostash -X ours origin main 2>/dev/null || {
              git rebase --abort 2>/dev/null || true
              git pull --no-rebase -X ours origin main -m "merge: sync with origin [skip ci]" 2>/dev/null || true
            }
            git push origin HEAD:main
          fi

      - name: İş Akışı İptal Bildirimi
        if: cancelled()
        run: |
          if [ -n "${{ secrets.TELEGRAM_BOT_TOKEN }}" ] && [ -n "${{ secrets.TELEGRAM_CHAT_ID }}" ]; then
            curl -s -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage" \
              -d "chat_id=${{ secrets.TELEGRAM_CHAT_ID }}" \
              -d "text=⚠️ <b>Ezan Plus Yayın Akışı İptal Edildi</b>%0Aİş akışı zaman aşımı veya harici bir müdahale ile sonlandırıldı." \
              -d "parse_mode=HTML" || true
          fi
